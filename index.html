<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flexbox - flex-flow Property</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Thực Hành: Thuộc Tính flex-flow Trong Flexbox</h1>
        <p>Viết tắt kết hợp giữa flex-direction và flex-wrap</p>
    </header>

    <main class="wrapper">
        <!-- VÍ DỤ 1: row nowrap -->
        <section class="demo-box">
            <h2>1. <code>flex-flow: row nowrap;</code> (Sắp xếp từ trái sang phải, không xuống dòng)</h2>
            <div class="container container-1">
                <div>1</div>
                <div>2</div>
                <div>3</div>
            </div>
        </section>

        <!-- VÍ DỤ 2: row-reverse nowrap -->
        <section class="demo-box">
            <h2>2. <code>flex-flow: row-reverse nowrap;</code> (Sắp xếp từ phải sang trái, không xuống dòng)</h2>
            <div class="container container-2">
                <div>1</div>
                <div>2</div>
                <div>3</div>
            </div>
        </section>
    </main>

</body>
</html>
