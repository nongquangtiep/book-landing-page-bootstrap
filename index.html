<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Thực hành Bảng trong CSS</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Bảng Quản Lý Nhân Viên</h2>

        <table id="custom-table">
            <thead>
                <tr>
                    <th>Mã NV</th>
                    <th>Họ và Tên</th>
                    <th>Vị Trí</th>
                    <th>Lương (VNĐ)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>NV01</td>
                    <td>Nguyễn Văn An</td>
                    <td>Lập trình viên Frontend</td>
                    <td>15,000,000</td>
                </tr>
                <tr>
                    <td>NV02</td>
                    <td>Trần Thị Bích</td>
                    <td>Chuyên viên Thiết kế UI/UX</td>
                    <td>14,500,000</td>
                </tr>
                <tr>
                    <td>NV03</td>
                    <td>Lê Hoàng Cường</td>
                    <td>Quản lý Dự án</td>
                    <td>22,000,000</td>
                </tr>
                <tr>
                    <td>NV04</td>
                    <td>Phạm Minh Đức</td>
                    <td>Kỹ sư DevOps</td>
                    <td>18,500,000</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
