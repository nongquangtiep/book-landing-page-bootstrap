<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tiêu đề h1 -->
        <h1 id="main-title">Trang web của tôi</h1>

        <!-- Đoạn văn mô tả bản thân -->
        <p class="description">
            Xin chào! Tôi là một lập trình viên đam mê khám phá công nghệ mới và xây dựng các giao diện web đẹp mắt, tối ưu trải nghiệm người dùng.
        </p>

        <!-- Danh sách sở thích -->
        <ul class="hobby-list">
            <li class="hobby-reading">Đọc sách công nghệ</li>
            <li class="hobby-coding">Lập trình web</li>
            <li class="hobby-sports">Chơi thể thao rèn luyện sức khỏe</li>
        </ul>

        <!-- Nút bấm -->
        <button type="button" class="btn-action">Nhấn vào đây</button>
    </div>

</body>
</html>
