<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Bài Tập Tạo Form Đơn Giản</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
            color: #333;
        }

        .form-container {
            background-color: #ffffff;
            max-width: 500px;
            margin: 0 auto 40px auto;
            padding: 24px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #2563eb;
        }

        h2 {
            margin-top: 0;
            color: #1e3a8a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .checkbox-group, .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .checkbox-group label, .radio-group label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input[type="submit"] {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        input[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        input[type="reset"] {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        input[type="reset"]:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM KHẢO SÁT THÔNG TIN VÀ SỞ THÍCH -->
    <div class="form-container">
        <h2>Phần 1: Thông Tin Cá Nhân</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="the_thao"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="am_nhac"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="doc_sach"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="du_lich"> Du lịch</label>
                </div>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>

    <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container" style="border-top-color: #059669;">
        <h2 style="color: #065f46;">Phần 2: Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="student-email">Email Address:</label>
                <input type="email" id="student-email" name="email" placeholder="student@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="0987654321" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" checked> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="birthday">Date of Birth:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label for="course">Course Selection:</label>
                <select id="course" name="course">
                    <option value="frontend">Web Frontend Fundamentals</option>
                    <option value="backend">Java Backend Development</option>
                    <option value="fullstack">Fullstack Web Developer</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your address..."></textarea>
            </div>

            <div class="btn-group">
                <input type="submit" value="Register Now" style="background-color: #059669;">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>

</body>
</html>
