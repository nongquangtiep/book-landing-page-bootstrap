<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng file JS ngoài với thuộc tính defer -->
    <script defer src="script.js"></script>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">MyWebsite</div>
            
            <ul class="nav-links">
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Giới thiệu</a></li>
                <li><a href="#">Dịch vụ</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>

            <div class="menu-icon">☰</div>
        </nav>
    </header>

    <main class="content">
        <h1>Thực hành Responsive Navbar</h1>
        <p>Thu nhỏ cửa sổ trình duyệt (hoặc bật F12 chuyển sang chế độ điện thoại) để kiểm tra nút menu ☰.</p>
    </main>

</body>
</html>
