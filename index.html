<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Market Research Survey</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #333333;
            background-color: #ffffff;
            margin: 0;
            padding: 20px 40px;
        }

        .survey-container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #555555;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dotted #cccccc;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        select {
            width: 50%;
            padding: 5px;
            font-size: 14px;
            border: 1px solid #7f9db9;
        }

        .radio-list, .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .radio-list label, .checkbox-list label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .other-input {
            margin-top: 4px;
            margin-left: 24px;
            padding: 3px 6px;
            border: 1px solid #ccc;
            width: 150px;
        }

        /* Price fields */
        .price-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 14px;
        }

        .price-unit {
            display: flex;
            flex-direction: column;
        }

        .price-unit input {
            padding: 4px;
            border: 1px solid #ccc;
        }

        .price-unit span {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .dot {
            align-self: center;
            font-weight: bold;
            padding-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: vertical;
        }

        /* Rating Table */
        table.rating-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }

        table.rating-table th, table.rating-table td {
            border: 1px solid #dcdcdc;
            padding: 10px 8px;
            text-align: center;
        }

        table.rating-table th {
            background-color: #ededed;
            font-weight: normal;
        }

        table.rating-table td.statement {
            text-align: left;
            font-weight: bold;
            width: 45%;
        }

        .rating-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-submit {
            margin-top: 25px;
            background-color: #0073aa;
            color: #ffffff;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-submit:hover {
            background-color: #005177;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        <h1>Market Research Survey</h1>
        <div class="subtitle">Please take a few moments to complete this satisfaction survey.</div>

        <form action="#" method="POST">
            <!-- 1. Age range -->
            <div class="form-group">
                <label class="form-label" for="age-range">What is your age range?</label>
                <select id="age-range" name="age_range">
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35-49">35-49</option>
                    <option value="50+">50+</option>
                </select>
            </div>

            <!-- 2. Income range -->
            <div class="form-group">
                <label class="form-label" for="income-range">What is your yearly income range?</label>
                <select id="income-range" name="income_range">
                    <option value="0-25000">$0 - $25,000</option>
                    <option value="25001-50000">$25,001 - $50,000</option>
                    <option value="50001-100000">$50,001 - $100,000</option>
                    <option value="100000+">$100,000+</option>
                </select>
            </div>

            <!-- 3. Gender Identity -->
            <div class="form-group">
                <label class="form-label">Gender Identity</label>
                <div class="radio-list">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="nonbinary"> Nonbinary</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
                <input type="text" name="gender_other" class="other-input">
            </div>

            <!-- 4. Products purchased -->
            <div class="form-group">
                <label class="form-label">Which of the following products have your purchased in the last 2 months. Please check all that apply.</label>
                <div class="checkbox-list">
                    <label><input type="checkbox" name="purchased_products" value="product1"> Product 1</label>
                    <label><input type="checkbox" name="purchased_products" value="product2"> Product 2</label>
                    <label><input type="checkbox" name="purchased_products" value="product3"> Product 3</label>
                </div>
            </div>

            <!-- 5. Frequency -->
            <div class="form-group">
                <label class="form-label">How often would you use our new product?</label>
                <div class="radio-list">
                    <label><input type="radio" name="frequency" value="daily"> Daily</label>
                    <label><input type="radio" name="frequency" value="weekly"> Weekly</label>
                    <label><input type="radio" name="frequency" value="monthly"> Monthly</label>
                </div>
            </div>

            <!-- 6. Pricing input -->
            <div class="form-group">
                <label class="form-label">What would you pay for the new product?</label>
                <div class="price-wrapper">
                    <span>$</span>
                    <div class="price-unit">
                        <input type="text" name="dollars" style="width: 70px;">
                        <span>Dollars</span>
                    </div>
                    <span class="dot">.</span>
                    <div class="price-unit">
                        <input type="text" name="cents" style="width: 30px;">
                        <span>Cents</span>
                    </div>
                </div>
            </div>

            <!-- 7. Features textarea -->
            <div class="form-group">
                <label class="form-label" for="features">What features would you like to see in the new product.</label>
                <textarea id="features" name="features"></textarea>
            </div>

            <!-- 8. Agreement Matrix / Rating Table -->
            <div class="form-group">
                <label class="form-label" style="font-weight: normal; margin-bottom: 6px;">Please rate your level of agreement with the following statements.</label>
                <table class="rating-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Strongly Disagree</th>
                            <th>Disagree</th>
                            <th>Agree</th>
                            <th>Strongly Agree</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="statement">Our products are priced fairly.</td>
                            <td>
                                <div class="rating-option">
                                    <input type="radio" name="fairly_priced" value="1">
                                    <span>1</span>
                                </div>
                            </td>
                            <td>
                                <div class="rating-option">
                                    <input type="radio" name="fairly_priced" value="2">
                                    <span>2</span>
                                </div>
                            </td>
                            <td>
                                <div class="rating-option">
                                    <input type="radio" name="fairly_priced" value="3">
                                    <span>3</span>
                                </div>
                            </td>
                            <td>
                                <div class="rating-option">
                                    <input type="radio" name="fairly_priced" value="4">
                                    <span>4</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>

</body>
</html>
