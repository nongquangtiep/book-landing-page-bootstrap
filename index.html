<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Grid - grid-gap</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Thực Hành: Thuộc Tính grid-gap (gap)</h1>
    </header>

    <main class="wrapper">
        <!-- VÍ DỤ 1: Khoảng cách giữa hàng và cột bằng nhau -->
        <section class="demo-box">
            <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau (<code>grid-gap: 20px;</code>)</h2>
            <div class="grid-container grid-example-1">
                <div>Ô 1</div>
                <div>Ô 2</div>
                <div>Ô 3</div>
                <div>Ô 4</div>
            </div>
        </section>

        <!-- VÍ DỤ 2: Khoảng cách hàng và cột khác nhau -->
        <section class="demo-box">
            <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau (<code>grid-gap: 30px 10px;</code>)</h2>
            <div class="grid-container grid-example-2">
                <div>Ô 1</div>
                <div>Ô 2</div>
                <div>Ô 3</div>
                <div>Ô 4</div>
                <div>Ô 5</div>
                <div>Ô 6</div>
            </div>
        </section>
    </main>

</body>
</html>
