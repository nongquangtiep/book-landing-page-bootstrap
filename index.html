<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="gallery-header">
        <h2>Responsive Image Gallery</h2>
        <h4>Thu nhỏ hoặc phóng to cửa sổ trình duyệt để quan sát số lượng ảnh trên mỗi hàng thay đổi.</h4>
    </header>

    <div class="gallery-container">
        <!-- Ảnh 1 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://picsum.photos/id/1015/600/400">
                    <img src="https://picsum.photos/id/1015/600/400" alt="Khung cảnh núi rừng" width="600" height="400">
                </a>
                <div class="desc">Khung cảnh thiên nhiên hùng vĩ</div>
            </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://picsum.photos/id/1016/600/400">
                    <img src="https://picsum.photos/id/1016/600/400" alt="Hẻm núi đá" width="600" height="400">
                </a>
                <div class="desc">Vẻ đẹp kỳ vĩ của hẻm núi</div>
            </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://picsum.photos/id/1018/600/400">
                    <img src="https://picsum.photos/id/1018/600/400" alt="Dãy núi sương mờ" width="600" height="400">
                </a>
                <div class="desc">Bình minh trên đỉnh núi</div>
            </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="https://picsum.photos/id/1019/600/400">
                    <img src="https://picsum.photos/id/1019/600/400" alt="Bờ biển đá" width="600" height="400">
                </a>
                <div class="desc">Sóng biển vỗ bờ hoàng hôn</div>
            </div>
        </div>
    </div>

</body>
</html>
