<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flexbox - flex-grow Property</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Thực Hành: Thuộc Tính flex-grow Trong Flexbox</h1>
        <p>Kiểm tra khả năng phân phối không gian trống cho các Flex Item</p>
    </header>

    <main class="wrapper">
        <section class="demo-box">
            <h2>Ví dụ: 5 Flex Items (Div thứ 2 có <code>flex-grow: 3;</code>, các div còn lại <code>flex-grow: 1;</code>)</h2>
            <div class="flex-container">
                <div class="item">Div 1</div>
                <div class="item item-grow">Div 2 (Grow: 3)</div>
                <div class="item">Div 3</div>
                <div class="item">Div 4</div>
                <div class="item">Div 5</div>
            </div>
        </section>
    </main>

</body>
</html>
