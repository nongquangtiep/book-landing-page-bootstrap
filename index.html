<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8fafc;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: #ffffff;
        }

        tbody tr:nth-child(even) {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Danh sách sản phẩm</h1>

        <table>
            <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Laptop Dell Inspiron</td>
                    <td>16,500,000 VNĐ</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>Chuột không dây Logitech</td>
                    <td>350,000 VNĐ</td>
                    <td>20</td>
                </tr>
                <tr>
                    <td>Bàn phím cơ DareU</td>
                    <td>850,000 VNĐ</td>
                    <td>12</td>
                </tr>
                <tr>
                    <td>Tai nghe Gaming Kingston HyperX</td>
                    <td>1,290,000 VNĐ</td>
                    <td>8</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
