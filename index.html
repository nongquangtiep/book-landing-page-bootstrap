<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Grid: grid-template-columns</title>
    <!-- Nhúng file CSS ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-header">
        <h1>Thực Hành: Thuộc Tính grid-template-columns Trong CSS Grid</h1>
    </header>

    <main class="demo-wrapper">
        <!-- VÍ DỤ 1: 3 Cột kích thước bằng nhau (1fr 1fr 1fr) -->
        <section class="demo-section">
            <h2>Ví dụ 1: 3 cột có kích thước bằng nhau (<code>1fr 1fr 1fr</code>)</h2>
            <div class="grid-container grid-equal">
                <div>Ô 1</div>
                <div>Ô 2</div>
                <div>Ô 3</div>
                <div>Ô 4</div>
                <div>Ô 5</div>
                <div>Ô 6</div>
            </div>
        </section>

        <!-- VÍ DỤ 2: Các cột có kích thước khác nhau (100px 200px 1fr) -->
        <section class="demo-section">
            <h2>Ví dụ 2: Các cột có kích thước khác nhau (<code>100px 200px 1fr</code>)</h2>
            <div class="grid-container grid-custom">
                <div>Cột 1 (100px)</div>
                <div>Cột 2 (200px)</div>
                <div>Cột 3 (1fr)</div>
                <div>Cột 1 (100px)</div>
                <div>Cột 2 (200px)</div>
                <div>Cột 3 (1fr)</div>
            </div>
        </section>
    </main>

</body>
</html>
